<form [formRoot]="bookingForm" class="flex flex-col gap-6">
  <fieldset class="dap-card">
    <legend class="dap-legend bg-yellow">01 - Date et heure</legend>

    <div class="mt-4 flex flex-col gap-4 sm:flex-row">
      <div class="flex flex-1 flex-col gap-2">
        <label for="booking-date" class="text-sm font-bold">Date</label>
        <input id="booking-date" type="date" [formField]="bookingForm.date" class="dap-input" />
      </div>

      <div class="flex flex-1 flex-col gap-2">
        <label for="booking-time" class="text-sm font-bold">Heure</label>
        <input id="booking-time" type="time" [formField]="bookingForm.time" class="dap-input" />
      </div>
    </div>
  </fieldset>

  <fieldset class="dap-card">
    <legend class="dap-legend bg-mint">02 - Type de rencontre</legend>

    <div class="mt-4 grid gap-3 sm:grid-cols-2">
      @for (format of formats(); track format.id) {
        <label [for]="`format-${format.id}`" class="cursor-pointer">
          <input
            [id]="`format-${format.id}`"
            type="radio"
            [value]="format.id"
            [formField]="bookingForm.format_id"
            class="peer sr-only"
          />

          <div
            class="dap-radio-base peer-checked:translate-y-0 peer-checked:bg-yellow peer-checked:shadow-[4px_4px_0_#30202B]"
          >
            <strong class="block text-lg font-extrabold">{{ format.name }}</strong>
            <span class="mt-1 block text-sm leading-5 text-ink/70">{{ format.description }}</span>
          </div>
        </label>
      }
    </div>
  </fieldset>

  <div class="flex justify-end">
    <button
      type="submit"
      [disabled]="bookingForm().invalid() || bookingForm().submitting()"
      class="dap-btn"
    >
      @if (bookingForm().submitting()) {
        Transmission de la demande...
      } @else {
        Soumettre la demande
      }
    </button>
  </div>
</form>

<div class="mt-6">
  @if (successMessage()) {
    <p role="status" class="rounded-xl border-2 border-ink bg-mint px-4 py-3 text-sm font-bold">
      {{ successMessage() }}
    </p>
  }

  @if (errorMessage()) {
    <p role="alert" class="rounded-xl border-2 border-ink bg-coral/30 px-4 py-3 text-sm font-bold">
      {{ errorMessage() }}
    </p>
  }
</div>
