<fieldset class="dap-card">
  <legend class="dap-legend bg-blue">03 - Demandes en cours</legend>

  @if (errorMessage()) {
    <p
      role="alert"
      class="mt-4 rounded-xl border-2 border-ink bg-coral/30 px-4 py-3 text-sm font-bold"
    >
      {{ errorMessage() }}
    </p>
  }

  <ul class="mt-6 flex flex-col gap-3">
    @for (booking of bookings(); track booking.id) {
      <li class="dap-card-cream flex items-center justify-between gap-4">
        <div>
          <strong class="block text-lg font-extrabold">
            {{ booking.format.name }}
          </strong>

          <span class="mt-1 block text-sm leading-5 text-ink/70">
            {{ booking.date | date: 'fullDate' }} à {{ booking.time }}
          </span>
        </div>

        <div class="flex shrink-0 items-center gap-2">
          <button
            type="button"
            (click)="addBookingToCalendar(booking)"
            title="Ajouter au calendrier"
            aria-label="Ajouter au calendrier"
            class="dap-icon-btn hover:bg-mint"
          >
            <svg
              class="h-4 w-4"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="4" width="18" height="18" rx="2" />
              <line x1="16" y1="2" x2="16" y2="6" />
              <line x1="8" y1="2" x2="8" y2="6" />
              <line x1="3" y1="10" x2="21" y2="10" />
              <line x1="12" y1="14" x2="12" y2="18" />
              <line x1="10" y1="16" x2="14" y2="16" />
            </svg>
          </button>

          <button
            type="button"
            [disabled]="bookingIdToDelete() === booking.id"
            (click)="removeBooking(booking.id)"
            title="Annuler le rendez-vous"
            aria-label="Annuler le rendez-vous"
            class="dap-icon-btn hover:bg-coral/40"
          >
            @if (bookingIdToDelete() === booking.id) {
              <svg class="h-4 w-4 animate-spin" viewBox="0 0 24 24" fill="none">
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="4"
                />
                <path
                  class="opacity-75"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.37 0 0 5.37 0 12h4z"
                />
              </svg>
            } @else {
              <svg
                v-else
                class="h-4 w-4"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <polyline points="3 6 5 6 21 6" />
                <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6" />
                <path d="M10 11v6" />
                <path d="M14 11v6" />
                <path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2" />
              </svg>
            }
          </button>
        </div>
      </li>
    } @empty {
      <li class="mt-4 text-sm font-semibold text-ink/70">Aucune demande ouverte pour le moment.</li>
    }
  </ul>
</fieldset>
